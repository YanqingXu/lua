<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lua VM Trace Viewer</title>
<style>
:root {
    --bg: #1e1e1e;
    --bg2: #252526;
    --bg3: #2d2d2d;
    --fg: #d4d4d4;
    --fg2: #808080;
    --accent: #569cd6;
    --accent2: #4ec9b0;
    --highlight: #264f78;
    --border: #3e3e42;
    --call: #dcdcaa;
    --ret: #c586c0;
    --err: #f44747;
    --font: 'Consolas', 'Courier New', monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 13px; height: 100vh; display: flex; flex-direction: column; }

/* ---- Toolbar ---- */
#toolbar { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 8px 12px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
#toolbar label { color: var(--fg2); }
#toolbar input[type="file"] { color: var(--fg); }
#toolbar input[type="text"] { background: var(--bg3); color: var(--fg); border: 1px solid var(--border); padding: 4px 8px; border-radius: 3px; width: 180px; }
#toolbar .info { color: var(--fg2); margin-left: auto; }
#toolbar button { background: var(--accent); color: #fff; border: none; padding: 4px 12px; border-radius: 3px; cursor: pointer; }
#toolbar button:hover { opacity: 0.85; }

/* ---- Main Grid ---- */
#main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; overflow: hidden; }

/* ---- Panel base ---- */
.panel { border: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
.panel-header { background: var(--bg2); padding: 4px 10px; font-weight: bold; color: var(--accent); border-bottom: 1px solid var(--border); flex-shrink: 0; font-size: 12px; }
.panel-body { flex: 1; overflow-y: auto; padding: 0; }

/* ---- Instruction list ---- */
#instr-list { grid-column: 1; grid-row: 1; }
#instr-list .panel-body { padding: 0; }
table.trace { width: 100%; border-collapse: collapse; }
table.trace th { position: sticky; top: 0; background: var(--bg2); padding: 3px 6px; text-align: left; font-size: 11px; color: var(--fg2); border-bottom: 1px solid var(--border); }
table.trace td { padding: 2px 6px; border-bottom: 1px solid var(--border); white-space: nowrap; cursor: pointer; }
table.trace tr:hover td { background: var(--bg3); }
table.trace tr.selected td { background: var(--highlight); }
table.trace tr.kind-call td { color: var(--call); }
table.trace tr.kind-return td { color: var(--ret); }
table.trace tr.kind-error td { color: var(--err); }

/* ---- Source panel ---- */
#source-panel { grid-column: 2; grid-row: 1; }
.source-line { padding: 1px 8px; white-space: pre; }
.source-line.active { background: var(--highlight); }
.line-no { display: inline-block; width: 40px; color: var(--fg2); text-align: right; margin-right: 12px; user-select: none; }

/* ---- Call stack ---- */
#callstack-panel { grid-column: 1; grid-row: 2; }
.cs-entry { padding: 3px 10px; }
.cs-entry.active { background: var(--highlight); }

/* ---- Registers ---- */
#registers-panel { grid-column: 2; grid-row: 2; }
table.regs { width: 100%; border-collapse: collapse; }
table.regs th { position: sticky; top: 0; background: var(--bg2); padding: 3px 6px; text-align: left; font-size: 11px; color: var(--fg2); border-bottom: 1px solid var(--border); }
table.regs td { padding: 2px 6px; border-bottom: 1px solid var(--border); }
.type-nil { color: var(--fg2); }
.type-number { color: #b5cea8; }
.type-string { color: #ce9178; }
.type-boolean { color: var(--accent); }
.type-table, .type-function, .type-userdata, .type-thread { color: var(--accent2); }
</style>
</head>
<body>
<div id="toolbar">
    <label>JSONL:</label>
    <input type="file" id="fileInput" accept=".jsonl,.json,.txt">
    <input type="text" id="filterInput" placeholder="Filter by opcode...">
    <button id="prevBtn" title="Previous (↑)">▲</button>
    <button id="nextBtn" title="Next (↓)">▼</button>
    <span class="info" id="statusInfo">No trace loaded</span>
</div>
<div id="main">
    <!-- Instruction list -->
    <div class="panel" id="instr-list">
        <div class="panel-header">Instruction Timeline</div>
        <div class="panel-body" id="instrBody">
            <table class="trace">
                <thead><tr><th>seq</th><th>pc</th><th>op</th><th>line</th><th>depth</th></tr></thead>
                <tbody id="instrTbody"></tbody>
            </table>
        </div>
    </div>
    <!-- Source panel -->
    <div class="panel" id="source-panel">
        <div class="panel-header">Source / Bytecode</div>
        <div class="panel-body" id="sourceBody"></div>
    </div>
    <!-- Call stack -->
    <div class="panel" id="callstack-panel">
        <div class="panel-header">Call Stack</div>
        <div class="panel-body" id="csBody"></div>
    </div>
    <!-- Registers -->
    <div class="panel" id="registers-panel">
        <div class="panel-header">Registers / Locals</div>
        <div class="panel-body" id="regsBody">
            <table class="regs">
                <thead><tr><th>slot</th><th>name</th><th>type</th><th>value</th></tr></thead>
                <tbody id="regsTbody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
// =========================================================================
// State
// =========================================================================
let events = [];
let filtered = [];
let selectedIdx = -1;
let sourceLines = {};  // source -> {lineNo -> text} (not available offline, placeholder)

// =========================================================================
// DOM refs
// =========================================================================
const fileInput = document.getElementById('fileInput');
const filterInput = document.getElementById('filterInput');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const statusInfo = document.getElementById('statusInfo');
const instrTbody = document.getElementById('instrTbody');
const instrBody = document.getElementById('instrBody');
const sourceBody = document.getElementById('sourceBody');
const csBody = document.getElementById('csBody');
const regsTbody = document.getElementById('regsTbody');

// =========================================================================
// File loading
// =========================================================================
fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
        const text = ev.target.result;
        events = text.trim().split('\n').map((line, i) => {
            try { return JSON.parse(line); }
            catch { console.warn('Bad JSON at line', i); return null; }
        }).filter(Boolean);
        applyFilter();
        statusInfo.textContent = `${events.length} events loaded`;
        if (filtered.length > 0) selectEvent(0);
    };
    reader.readAsText(file);
});

// =========================================================================
// Filtering
// =========================================================================
filterInput.addEventListener('input', () => { applyFilter(); renderInstrList(); });

function applyFilter() {
    const q = filterInput.value.trim().toUpperCase();
    if (!q) {
        filtered = events.map((e, i) => i);
    } else {
        filtered = [];
        events.forEach((e, i) => {
            if (e.kind === 'instruction' && e.op && e.op.toUpperCase().includes(q)) filtered.push(i);
            else if (e.kind && e.kind.toUpperCase().includes(q)) filtered.push(i);
        });
    }
    renderInstrList();
}

// =========================================================================
// Instruction list rendering (virtual: show all, let browser handle scroll)
// =========================================================================
function renderInstrList() {
    instrTbody.innerHTML = '';
    const frag = document.createDocumentFragment();
    for (const idx of filtered) {
        const ev = events[idx];
        const tr = document.createElement('tr');
        tr.dataset.idx = idx;
        if (ev.kind !== 'instruction') tr.classList.add('kind-' + ev.kind);

        const seqTd = document.createElement('td');
        seqTd.textContent = ev.seq;
        tr.appendChild(seqTd);

        const pcTd = document.createElement('td');
        pcTd.textContent = ev.kind === 'instruction' ? ev.pc : '-';
        tr.appendChild(pcTd);

        const opTd = document.createElement('td');
        opTd.textContent = ev.kind === 'instruction' ? ev.op : ev.kind.toUpperCase();
        tr.appendChild(opTd);

        const lineTd = document.createElement('td');
        lineTd.textContent = ev.line != null ? ev.line : '-';
        tr.appendChild(lineTd);

        const depthTd = document.createElement('td');
        depthTd.textContent = ev.callDepth != null ? ev.callDepth : '-';
        tr.appendChild(depthTd);

        tr.addEventListener('click', () => {
            const pos = filtered.indexOf(idx);
            if (pos >= 0) selectEvent(pos);
        });

        frag.appendChild(tr);
    }
    instrTbody.appendChild(frag);
}

// =========================================================================
// Selection
// =========================================================================
function selectEvent(filteredPos) {
    if (filteredPos < 0 || filteredPos >= filtered.length) return;
    selectedIdx = filteredPos;
    const evIdx = filtered[filteredPos];
    const ev = events[evIdx];

    // Highlight row
    instrTbody.querySelectorAll('tr.selected').forEach(r => r.classList.remove('selected'));
    const rows = instrTbody.querySelectorAll('tr');
    for (const r of rows) {
        if (parseInt(r.dataset.idx) === evIdx) {
            r.classList.add('selected');
            r.scrollIntoView({ block: 'nearest' });
            break;
        }
    }

    renderSource(ev);
    renderCallStack(ev, evIdx);
    renderRegisters(ev);
}

// =========================================================================
// Source panel
// =========================================================================
function renderSource(ev) {
    sourceBody.innerHTML = '';
    if (!ev.line && ev.line !== 0) {
        sourceBody.textContent = '(no source line info)';
        return;
    }
    // Build a simple disassembly view from all instruction events sharing same source
    const src = ev.source || '?';
    const lineEvents = {};
    for (const e of events) {
        if (e.kind === 'instruction' && e.source === src && e.line > 0) {
            if (!lineEvents[e.line]) lineEvents[e.line] = [];
            lineEvents[e.line].push(e.op);
        }
    }
    const lines = Object.keys(lineEvents).map(Number).sort((a, b) => a - b);
    if (lines.length === 0) {
        sourceBody.textContent = '(no line data)';
        return;
    }
    const minLine = Math.max(1, lines[0]);
    const maxLine = lines[lines.length - 1];
    const frag = document.createDocumentFragment();
    for (let ln = minLine; ln <= maxLine; ln++) {
        const div = document.createElement('div');
        div.classList.add('source-line');
        if (ln === ev.line) div.classList.add('active');
        const ops = lineEvents[ln] ? ` [${[...new Set(lineEvents[ln])].join(', ')}]` : '';
        div.innerHTML = `<span class="line-no">${ln}</span>line ${ln}${ops}`;
        frag.appendChild(div);
    }
    sourceBody.appendChild(frag);
}

// =========================================================================
// Call stack panel
// =========================================================================
function renderCallStack(ev, evIdx) {
    csBody.innerHTML = '';
    // Walk backwards to reconstruct call stack
    const stack = [];
    let depth = ev.callDepth || 1;
    for (let i = evIdx; i >= 0 && depth > 0; i--) {
        const e = events[i];
        if (e.kind === 'call' && e.callDepth === depth) {
            stack.unshift({ name: e.funcName || '?', source: e.source || '?', line: e.line || 0 });
            depth--;
        }
    }
    // Always show at least one entry
    if (stack.length === 0) {
        stack.push({ name: ev.source || 'main chunk', source: ev.source || '?', line: ev.line || 0 });
    }

    const frag = document.createDocumentFragment();
    stack.forEach((frame, i) => {
        const div = document.createElement('div');
        div.classList.add('cs-entry');
        if (i === stack.length - 1) div.classList.add('active');
        div.textContent = `[${i + 1}] ${frame.name} (${frame.source}:${frame.line})`;
        frag.appendChild(div);
    });
    csBody.appendChild(frag);
}

// =========================================================================
// Registers panel
// =========================================================================
function renderRegisters(ev) {
    regsTbody.innerHTML = '';
    if (!ev.registers) return;
    const frag = document.createDocumentFragment();
    for (const reg of ev.registers) {
        const tr = document.createElement('tr');

        const slotTd = document.createElement('td');
        slotTd.textContent = reg.slot;
        tr.appendChild(slotTd);

        const nameTd = document.createElement('td');
        nameTd.textContent = reg.name || '-';
        tr.appendChild(nameTd);

        const typeTd = document.createElement('td');
        typeTd.textContent = reg.type || '?';
        typeTd.classList.add('type-' + (reg.type || 'nil'));
        tr.appendChild(typeTd);

        const valTd = document.createElement('td');
        valTd.textContent = formatValue(reg.value, reg.type);
        valTd.classList.add('type-' + (reg.type || 'nil'));
        tr.appendChild(valTd);

        frag.appendChild(tr);
    }
    regsTbody.appendChild(frag);
}

function formatValue(val, type) {
    if (val === null || val === undefined) return 'nil';
    if (typeof val === 'string') return val;
    return JSON.stringify(val);
}

// =========================================================================
// Navigation
// =========================================================================
prevBtn.addEventListener('click', () => { if (selectedIdx > 0) selectEvent(selectedIdx - 1); });
nextBtn.addEventListener('click', () => { if (selectedIdx < filtered.length - 1) selectEvent(selectedIdx + 1); });

document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowUp' || e.key === 'k') { e.preventDefault(); prevBtn.click(); }
    if (e.key === 'ArrowDown' || e.key === 'j') { e.preventDefault(); nextBtn.click(); }
});

</script>
</body>
</html>
