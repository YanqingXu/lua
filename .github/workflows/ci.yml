name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  windows-msbuild:
    name: Windows MSBuild (${{ matrix.configuration }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build tests
        shell: powershell
        run: MSBuild.exe lua_test.vcxproj /m /p:Configuration=${{ matrix.configuration }} /p:Platform=x64

      - name: Documentation drift
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\check_doc_drift.ps1

      - name: Quality gate smoke
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\run_quality_gate.ps1 -SkipBuild -SkipClangTidy -FormatScope Off

      - name: Quality gate contract tests
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\test_quality_gate.ps1

      - name: Run tests
        shell: powershell
        run: bin\lua_test.exe

  linux-cmake:
    name: Linux ${{ matrix.compiler }} (${{ matrix.build_type }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: GCC
            cc: gcc
            cxx: g++
            build_type: Debug
          - compiler: GCC
            cc: gcc
            cxx: g++
            build_type: Release
          - compiler: Clang
            cc: clang
            cxx: clang++
            build_type: Debug
          - compiler: Clang
            cc: clang
            cxx: clang++
            build_type: Release
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 300

      - name: Install Lua 5.1 reference
        if: matrix.compiler == 'Clang' && matrix.build_type == 'Debug'
        run: sudo apt-get update && sudo apt-get install --yes lua5.1

      - name: Lua 5.1 differential evidence
        if: matrix.compiler == 'Clang' && matrix.build_type == 'Debug'
        shell: pwsh
        run: >-
          ./tools/run_lua51_differential.ps1
          -ReferenceLua /usr/bin/lua5.1
          -CandidateLua build/lua_app
          -ResultPath build/lua51-differential.json

      - name: Upload differential evidence
        if: always() && matrix.compiler == 'Clang' && matrix.build_type == 'Debug'
        uses: actions/upload-artifact@v4
        with:
          name: lua51-differential-evidence
          path: build/lua51-differential.json

      - name: Official slow sort gate
        if: matrix.compiler == 'Clang' && matrix.build_type == 'Debug'
        shell: pwsh
        run: >-
          ./tools/run_lua51_official_slow.ps1
          -LuaApp build/lua_app
          -Case sort
          -TimeoutSeconds 120

      - name: Official slow verybig gate
        if: matrix.compiler == 'Clang' && matrix.build_type == 'Debug'
        shell: pwsh
        run: >-
          ./tools/run_lua51_official_slow.ps1
          -LuaApp build/lua_app
          -Case verybig
          -TimeoutSeconds 300

      - name: Official strict evidence
        if: matrix.compiler == 'Clang' && matrix.build_type == 'Debug'
        shell: pwsh
        run: >-
          ./tools/run_lua51_official_strict.ps1
          -Executable build/lua_app
          -TimeoutSeconds 300
          -ExpectFailure
          -ResultPath build/official-strict.json

      - name: Upload official strict evidence
        if: always() && matrix.compiler == 'Clang' && matrix.build_type == 'Debug'
        uses: actions/upload-artifact@v4
        with:
          name: official-strict-evidence
          path: build/official-strict.json

  linux-sanitizers:
    name: Linux Clang (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined]
    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      LUA_TEST_DISABLE_MEMORY_LIMIT: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure sanitizer
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DLUA_CPP_SANITIZER=${{ matrix.sanitizer }}

      - name: Build sanitizer
        run: cmake --build build --parallel 2

      - name: Test sanitizer
        run: ctest --test-dir build --output-on-failure --timeout 600

  linux-runtime-benchmark:
    name: Linux runtime benchmark contract
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Release benchmark
        run: >-
          cmake -S . -B build/benchmark
          -DCMAKE_BUILD_TYPE=Release
          -DLUA_CPP_BUILD_BENCHMARKS=ON
          -DLUA_CPP_BUILD_TESTS=OFF
          -DLUA_CPP_BUILD_TOOLS=OFF

      - name: Build benchmark
        run: cmake --build build/benchmark --parallel 2 --target lua_runtime_bench

      - name: Run benchmark contract
        timeout-minutes: 10
        run: >-
          ./build/benchmark/lua_runtime_bench
          --profile ci
          --json build/benchmark/runtime-bench.json

      - name: Validate benchmark evidence
        shell: pwsh
        run: >-
          ./tools/check_runtime_bench.ps1
          -ResultPath build/benchmark/runtime-bench.json

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-benchmark-evidence
          path: build/benchmark/runtime-bench.json

  linux-lint:
    name: Linux clang-format / clang-tidy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install LLVM tools
        run: sudo apt-get update && sudo apt-get install --yes clang-format clang-tidy

      - name: clang-format
        shell: bash
        run: |
          files=(
            src/debug/trace_sink.hpp
            src/io/file_loader.cpp
            tests/unit/io/test_file_loader.cpp
          )
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            diff_base="origin/$GITHUB_BASE_REF"
            diff_range="$diff_base...HEAD"
            list_changed_files() {
              git diff --name-only --diff-filter=ACMRT "$diff_range"
            }
          else
            event_before="${{ github.event.before }}"
            zero_sha="0000000000000000000000000000000000000000"
            if [[ -n "$event_before" && "$event_before" != "$zero_sha" ]] &&
               git cat-file -e "$event_before^{commit}" 2>/dev/null; then
              diff_range="$event_before..HEAD"
              list_changed_files() {
                git diff --name-only --diff-filter=ACMRT "$diff_range"
              }
            else
              list_changed_files() {
                git ls-files
              }
            fi
          fi
          while IFS= read -r file; do
            if [[ "$file" =~ ^(src|tests/unit|benchmarks)/.*\.(cpp|hpp|h)$ ]]; then
              files+=("$file")
            fi
          done < <(list_changed_files)
          mapfile -t files < <(printf '%s\n' "${files[@]}" | sort -u)
          clang-format --dry-run --Werror --style=file "${files[@]}"

      - name: Configure compile database
        env:
          CC: clang
          CXX: clang++
        run: >-
          cmake -S . -B build/lint
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DLUA_CPP_BUILD_BENCHMARKS=ON

      - name: clang-tidy
        run: python3 tools/run_clang_tidy.py --build-dir build/lint
