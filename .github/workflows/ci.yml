name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-msbuild:
    name: Windows MSBuild (${{ matrix.configuration }})
    runs-on: windows-latest
    env:
      LUA_TEST_DISABLE_MEMORY_LIMIT: 1
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      - name: Build tests
        shell: powershell
        run: >-
          MSBuild.exe lua_test.vcxproj /m
          /p:Configuration=${{ matrix.configuration }}
          /p:Platform=x64
          /p:LuaTestBuildGitSha=${{ github.sha }}

      - name: Configure CMake API, native-module, and production-worker evidence
        shell: powershell
        run: cmake -S . -B build/windows-cmake -A x64

      - name: Build CMake API, native-module, and production-worker evidence
        shell: powershell
        run: >-
          cmake --build build/windows-cmake
          --config ${{ matrix.configuration }}
          --parallel 2
          --target
          lua_public_api_consumer
          lua_public_api_shared_consumer
          lua51_c_api_differential_probe
          lua_public_native_module_host
          lua_public_native_module_app
          lua_public_native_module_embedding
          lua_production_worker
          lua_runtime_soak

      - name: Run CMake API, native-module, and production-worker evidence
        shell: powershell
        run: >-
          ctest --test-dir build/windows-cmake
          -C ${{ matrix.configuration }}
          -L "api-contract|production-contract|runtime-failure-contract|soak-smoke"
          --output-on-failure

      - name: Documentation drift
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\check_doc_drift.ps1

      - name: Quality gate smoke
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\run_quality_gate.ps1 -SkipBuild -SkipClangTidy -FormatScope Off

      - name: Quality gate contract tests
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\test_quality_gate.ps1

      - name: Verify test binary build SHA
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File tools\check_test_binary_sha.ps1
          -TestExecutable bin\lua_test.exe
          -ExpectedSha $env:GITHUB_SHA

      - name: Run tests
        shell: powershell
        run: bin\lua_test.exe

  linux-cmake:
    name: Linux ${{ matrix.compiler }} (${{ matrix.build_type }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: GCC
            cc: gcc
            cxx: g++
            build_type: Debug
          - compiler: GCC
            cc: gcc
            cxx: g++
            build_type: Release
          - compiler: Clang
            cc: clang-18
            cxx: clang++-18
            cxxflags: -stdlib=libc++
            build_type: Debug
          - compiler: Clang
            cc: clang-18
            cxx: clang++-18
            cxxflags: -stdlib=libc++
            build_type: Release
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      CXXFLAGS: ${{ matrix.cxxflags }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Clang C++ standard library
        if: matrix.compiler == 'Clang'
        run: sudo apt-get update && sudo apt-get install --yes libc++-18-dev libc++abi-18-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 300

      - name: Install Lua 5.1 reference
        if: matrix.compiler == 'Clang' && matrix.build_type == 'Debug'
        run: sudo apt-get update && sudo apt-get install --yes lua5.1 liblua5.1-0-dev

      - name: Lua 5.1 differential evidence
        if: matrix.compiler == 'Clang' && matrix.build_type == 'Debug'
        shell: pwsh
        run: >-
          ./tools/run_lua51_differential.ps1
          -ReferenceLua /usr/bin/lua5.1
          -CandidateLua build/lua_app
          -ResultPath build/lua51-differential.json

      - name: Build Lua 5.1 C API reference probe
        if: matrix.compiler == 'Clang' && matrix.build_type == 'Debug'
        run: >-
          cc tests/compatibility/lua51_c_api_differential_probe.c
          -o build/lua51-c-api-reference
          $(pkg-config --cflags --libs lua5.1)

      - name: Lua 5.1 C API differential evidence
        if: matrix.compiler == 'Clang' && matrix.build_type == 'Debug'
        shell: pwsh
        run: >-
          ./tools/run_lua51_c_api_differential.ps1
          -ReferenceProbe build/lua51-c-api-reference
          -CandidateProbe build/lua51_c_api_differential_probe
          -ResultPath build/lua51-c-api-differential.json

      - name: Upload differential evidence
        if: always() && matrix.compiler == 'Clang' && matrix.build_type == 'Debug'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lua51-differential-evidence
          path: |
            build/lua51-differential.json
            build/lua51-c-api-differential.json

      - name: Official slow sort gate
        if: matrix.compiler == 'Clang' && matrix.build_type == 'Debug'
        shell: pwsh
        run: >-
          ./tools/run_lua51_official_slow.ps1
          -LuaApp build/lua_app
          -Case sort
          -TimeoutSeconds 120

      - name: Official slow verybig gate
        if: matrix.compiler == 'Clang' && matrix.build_type == 'Debug'
        shell: pwsh
        run: >-
          ./tools/run_lua51_official_slow.ps1
          -LuaApp build/lua_app
          -Case verybig
          -TimeoutSeconds 300

      - name: Official strict evidence
        if: matrix.compiler == 'Clang' && matrix.build_type == 'Release'
        shell: pwsh
        run: >-
          ./tools/run_lua51_official_strict.ps1
          -Executable build/lua_app
          -TimeoutSeconds 300
          -ResultPath build/official-strict.json

      - name: Upload official strict evidence
        if: always() && matrix.compiler == 'Clang' && matrix.build_type == 'Release'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: official-strict-evidence
          path: build/official-strict.json

  linux-sanitizers:
    name: Linux Clang (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined, thread]
    env:
      CC: clang-18
      CXX: clang++-18
      CXXFLAGS: -stdlib=libc++
      # Ubuntu's shared libc++abi exception strings cross an interposed
      # operator-new/free boundary. Keep every other ASan/LSan check enabled.
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:alloc_dealloc_mismatch=0
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      TSAN_OPTIONS: halt_on_error=1:history_size=7
      LUA_TEST_DISABLE_MEMORY_LIMIT: 1

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Clang C++ standard library
        run: sudo apt-get update && sudo apt-get install --yes libc++-18-dev libc++abi-18-dev

      - name: Configure sanitizer
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DLUA_CPP_SANITIZER=${{ matrix.sanitizer }}

      - name: Build sanitizer
        run: cmake --build build --parallel 2

      - name: Test sanitizer
        shell: bash
        run: |
          # ASan and TSan reserve large shadow address ranges. The production
          # worker intentionally installs a low RLIMIT_AS before running Lua,
          # so those process-boundary tests are intrinsically incompatible
          # with either shadow-memory runtime. The separate runtime fault
          # matrix explicitly bypasses only the OS limiter and therefore
          # remains enabled under ASan/TSan.
          if [[ "${{ matrix.sanitizer }}" == "address" || "${{ matrix.sanitizer }}" == "thread" ]]; then
            ctest --test-dir build --output-on-failure --timeout 900 -LE production-contract
          else
            ctest --test-dir build --output-on-failure --timeout 900
          fi

  allocator-failure-contract:
    name: Allocator failure contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure allocator contract
        run: >-
          cmake -S . -B build/allocator -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DLUA_CPP_BUILD_TOOLS=OFF

      - name: Build allocator contract
        run: cmake --build build/allocator --parallel 2 --target lua_test

      - name: Run with process memory limit and fail-on-N enabled
        shell: pwsh
        run: |
          Remove-Item Env:LUA_TEST_DISABLE_MEMORY_LIMIT -ErrorAction SilentlyContinue
          $executable = if ($IsWindows) { "build/allocator/lua_test.exe" } else { "build/allocator/lua_test" }
          & $executable --exclude-filter "Lua 5.1 Official"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  linux-fuzzers:
    name: Linux libFuzzer security boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CC: clang-19
      CXX: clang++-19
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Clang
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          clang-19 libfuzzer-19-dev

      - name: Configure fuzzers
        run: >-
          cmake -S . -B build/fuzz
          -DCMAKE_BUILD_TYPE=Debug
          -DLUA_CPP_BUILD_FUZZERS=ON
          -DLUA_CPP_BUILD_TESTS=OFF
          -DLUA_CPP_BUILD_TOOLS=OFF

      - name: Build fuzzers
        run: >-
          cmake --build build/fuzz --parallel 2 --target
          fuzz_undump
          fuzz_bytecode_verifier
          fuzz_parser
          fuzz_stdlib_numeric_arguments

      - name: Run bounded fuzz smoke
        shell: bash
        run: |
          mkdir -p build/fuzz-artifacts
          targets=(undump bytecode_verifier parser stdlib_numeric_arguments)
          for target in "${targets[@]}"; do
            "build/fuzz/fuzz_${target}" "tests/fuzz/corpus/${target}" \
              -max_total_time=30 \
              -timeout=5 \
              -max_len=1048576 \
              -rss_limit_mb=2048 \
              -artifact_prefix="build/fuzz-artifacts/${target}-"
          done

      - name: Upload fuzzer artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: libfuzzer-crash-artifacts
          path: build/fuzz-artifacts/
          if-no-files-found: ignore

  portability:
    name: Portability (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            disable_memory_limit: 0
          - name: macOS ARM64
            runner: macos-15
            disable_memory_limit: 1

    env:
      # Darwin does not implement RLIMIT_AS as a usable process cap. The
      # allocator contract jobs retain the hard-cap evidence on Linux/Windows.
      LUA_TEST_DISABLE_MEMORY_LIMIT: ${{ matrix.disable_memory_limit }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure
        run: cmake -S . -B build/portability -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build/portability --parallel 2

      - name: Test
        run: ctest --test-dir build/portability --output-on-failure --timeout 600

  linux-coverage:
    name: Linux component coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CC: clang-18
      CXX: clang++-18
      CXXFLAGS: -stdlib=libc++

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Workflow evidence metadata contract tests
        run: python3 tools/test_write_workflow_evidence.py

      - name: Install LLVM coverage tools
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          clang-18 llvm-18 libc++-18-dev libc++abi-18-dev

      - name: Configure coverage
        run: >-
          cmake -S . -B build/coverage
          -DCMAKE_BUILD_TYPE=Debug
          -DLUA_CPP_ENABLE_COVERAGE=ON

      - name: Build coverage runner
        run: cmake --build build/coverage --parallel 2 --target lua_test lua_app

      - name: Run coverage suites
        shell: bash
        run: |
          mkdir -p build/coverage/profiles
          export LLVM_PROFILE_FILE="$PWD/build/coverage/profiles/%p-%m.profraw"
          export LUA_TEST_APP_PATH="$PWD/build/coverage/lua_app"
          build/coverage/lua_test --exclude-filter "Lua 5.1 Official"
          build/coverage/lua_test --filter "Lua 5.1 Official Smoke"
          build/coverage/lua_test --filter "Lua 5.1 Official TestC"

      - name: Export and summarize coverage
        shell: bash
        run: |
          llvm-profdata-18 merge -sparse build/coverage/profiles/*.profraw -o build/coverage/merged.profdata
          llvm-cov-18 export -summary-only build/coverage/lua_test \
            -instr-profile=build/coverage/merged.profdata \
            > build/coverage/coverage.json
          cp tests/coverage/component-thresholds.json \
            build/coverage/component-thresholds.json
          python3 tools/summarize_coverage.py \
            build/coverage/coverage.json \
            build/coverage/coverage-components.json \
            --thresholds build/coverage/component-thresholds.json
          llvm-cov-18 show build/coverage/lua_test \
            -instr-profile=build/coverage/merged.profdata \
            -format=html \
            -output-dir=build/coverage/html

      - name: Write coverage evidence metadata
        run: >-
          python3 tools/write_workflow_evidence.py
          --kind component-coverage
          --output build/coverage/evidence-metadata.json

      - name: Upload coverage evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: component-coverage
          path: |
            build/coverage/coverage.json
            build/coverage/coverage-components.json
            build/coverage/component-thresholds.json
            build/coverage/evidence-metadata.json
            build/coverage/html/
          if-no-files-found: error

  linux-runtime-benchmark:
    name: Linux runtime benchmark contract
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve benchmark revisions
        id: revisions
        shell: bash
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          zero_sha=0000000000000000000000000000000000000000
          base_sha="$EVENT_BASE_SHA"
          if [[ -z "$base_sha" || "$base_sha" == "$zero_sha" ]]; then
            base_sha=$(git rev-parse HEAD^)
          fi
          git cat-file -e "$base_sha^{commit}"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "head_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          git worktree add --detach build/benchmark-base-source "$base_sha"
          cp benchmarks/runtime_bench.cpp build/benchmark-base-source/benchmarks/runtime_bench.cpp

      - name: Configure base Release benchmark
        run: >-
          cmake -S build/benchmark-base-source -B build/benchmark-base
          -DCMAKE_BUILD_TYPE=Release
          -DLUA_CPP_BUILD_BENCHMARKS=ON
          -DLUA_CPP_BUILD_TESTS=OFF
          -DLUA_CPP_BUILD_TOOLS=OFF

      - name: Configure head Release benchmark
        run: >-
          cmake -S . -B build/benchmark-head
          -DCMAKE_BUILD_TYPE=Release
          -DLUA_CPP_BUILD_BENCHMARKS=ON
          -DLUA_CPP_BUILD_TESTS=OFF
          -DLUA_CPP_BUILD_TOOLS=OFF

      - name: Build base and head benchmarks
        shell: bash
        run: |
          cmake --build build/benchmark-base --parallel 2 --target lua_runtime_bench
          cmake --build build/benchmark-head --parallel 2 --target lua_runtime_bench

      - name: Run interleaved base-vs-head benchmark gate
        timeout-minutes: 25
        shell: pwsh
        run: >-
          ./tools/run_runtime_bench_comparison.ps1
          -BaseExecutable build/benchmark-base/lua_runtime_bench
          -HeadExecutable build/benchmark-head/lua_runtime_bench
          -BaseSha ${{ steps.revisions.outputs.base_sha }}
          -HeadSha ${{ steps.revisions.outputs.head_sha }}
          -OutputDirectory build/benchmark-comparison

      - name: Write benchmark evidence metadata
        run: >-
          python3 tools/write_workflow_evidence.py
          --kind runtime-benchmark-evidence
          --output build/benchmark-comparison/evidence-metadata.json

      - name: Upload benchmark evidence
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-benchmark-evidence
          path: build/benchmark-comparison/
          if-no-files-found: error

      - name: Upload benchmark failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-benchmark-diagnostics-${{ github.run_attempt }}
          path: build/benchmark-comparison/
          if-no-files-found: warn
          retention-days: 7

  linux-lint:
    name: Linux clang-format / clang-tidy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install LLVM tools
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          clang-format clang-tidy libc++-18-dev libc++abi-18-dev

      - name: clang-format
        shell: bash
        run: |
          is_owned_cpp() {
            local file="$1"
            [[ "$file" =~ \.(c|cc|cpp|cxx|h|hpp)$ ]] || return 1
            case "$file" in
              tests/lua/official/*) return 1 ;;
              src/*|tests/*|examples/*|benchmarks/*|lua_test/*) return 0 ;;
              *) return 1 ;;
            esac
          }
          files=(
            src/debug/trace_sink.hpp
            src/io/file_loader.cpp
            tests/unit/io/test_file_loader.cpp
          )
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            diff_base="origin/$GITHUB_BASE_REF"
            diff_range="$diff_base...HEAD"
            list_changed_files() {
              git diff --name-only --diff-filter=ACMRT "$diff_range"
            }
          else
            event_before="${{ github.event.before }}"
            zero_sha="0000000000000000000000000000000000000000"
            if [[ -n "$event_before" && "$event_before" != "$zero_sha" ]] &&
               git cat-file -e "$event_before^{commit}" 2>/dev/null; then
              diff_range="$event_before..HEAD"
              list_changed_files() {
                git diff --name-only --diff-filter=ACMRT "$diff_range"
              }
            else
              list_changed_files() {
                git ls-files
              }
            fi
          fi
          while IFS= read -r file; do
            if is_owned_cpp "$file"; then
              files+=("$file")
            fi
          done < <(list_changed_files)
          mapfile -t files < <(printf '%s\n' "${files[@]}" | sort -u)
          clang-format --dry-run --Werror --style=file "${files[@]}"

      - name: Configure compile database
        env:
          CC: clang-18
          CXX: clang++-18
          CXXFLAGS: -stdlib=libc++
        run: >-
          cmake -S . -B build/lint
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DLUA_CPP_BUILD_BENCHMARKS=ON

      - name: clang-tidy
        run: python3 tools/run_clang_tidy.py --build-dir build/lint
