name: Release candidate packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Candidate version, for example 0.1.0-rc.1
        required: true
        default: "0.1.0-rc.1"

permissions:
  contents: read

jobs:
  governance:
    name: Release governance
    runs-on: ubuntu-latest
    steps:
      - name: Enforce tag publication approval
        shell: bash
        env:
          GOVERNANCE_APPROVED: ${{ vars.LUA_RELEASE_GOVERNANCE_APPROVED }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GOVERNANCE_APPROVED" != "true" ]]; then
            echo "Tag publication is paused until repository governance is approved." >&2
            exit 1
          fi

  packages:
    name: SDK package (${{ matrix.rid }})
    needs: governance
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: windows-x64
            generator: ""
          - os: ubuntu-latest
            rid: linux-x64
            generator: Ninja
          - os: macos-15
            rid: macos-arm64
            generator: Ninja

    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") {
            $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            '${{ inputs.version }}'
          }
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(?:-rc\.[0-9]+)?$') {
            throw "Invalid release version: $version"
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Source readiness
        shell: pwsh
        run: >-
          ./tools/check_release_readiness.ps1
          -ExpectedVersion ${{ steps.version.outputs.value }}

      - name: Configure Release
        shell: pwsh
        run: |
          if ($IsWindows) {
            cmake -S . -B build/release -A x64 `
              -DLUA_CPP_BUILD_BENCHMARKS=ON
          } else {
            cmake -S . -B build/release -G '${{ matrix.generator }}' `
              -DCMAKE_BUILD_TYPE=Release `
              -DLUA_CPP_BUILD_BENCHMARKS=ON
          }

      - name: Build Release
        run: cmake --build build/release --config Release --parallel 2

      - name: Test Release
        run: ctest --test-dir build/release -C Release --output-on-failure --timeout 900

      - name: Package SDK, SBOM, and checksums
        shell: pwsh
        run: >-
          ./tools/package_release.ps1
          -BuildDirectory build/release
          -OutputDirectory dist
          -Version ${{ steps.version.outputs.value }}
          -RuntimeIdentifier ${{ matrix.rid }}
          -Configuration Release
          -Commit $env:GITHUB_SHA

      - name: Upload candidate package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lua-cpp-${{ steps.version.outputs.value }}-${{ matrix.rid }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish immutable candidate
    if: startsWith(github.ref, 'refs/tags/')
    needs: packages
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download package artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --dir release-artifacts

      - name: Consolidate artifacts and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          find release-artifacts -type f \
            \( -name '*.zip' -o -name '*.spdx.json' -o -name '*.manifest.json' -o -name '*.SHA256SUMS' \) \
            -exec cp '{}' release/ \;
          cd release
          sha256sum -- *.zip *.spdx.json *.manifest.json *.SHA256SUMS > SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          args=(release create "$GITHUB_REF_NAME" release/* \
            --verify-tag \
            --title "Lua C++ $GITHUB_REF_NAME" \
            --notes-file docs/release/rc-notes-0.1.0.md)
          if [[ "$GITHUB_REF_NAME" == *-rc.* ]]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"
